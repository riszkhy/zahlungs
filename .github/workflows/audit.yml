name: Security audit

on:
  push:
    branches: [master, main]
  pull_request:
  # Weekly run so newly-published advisories are caught even without a push.
  schedule:
    - cron: "0 3 * * 1"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    env:
      MIX_ENV: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27"

      - name: Install dependencies
        run: mix deps.get

      # Known CVEs / advisories in the locked deps (mix_audit).
      - name: Audit dependencies
        run: mix deps.audit

      # Retired / deprecated packages.
      - name: Check for retired packages
        run: mix hex.audit
